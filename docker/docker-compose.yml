version: "3.8"

# Stack de observabilidad para la demo de distributed tracing.
#
# Flujo de telemetría:
#   [bff / customer-api / product-api]
#         │ OTLP gRPC (puerto 4317)
#         ▼
#   [otel-collector]   ← recibe, procesa y enruta spans
#         │ OTLP gRPC
#         ▼
#   [jaeger]           ← almacena y visualiza traces
#         │ HTTP
#         ▼
#   http://localhost:16686  ← UI de Jaeger

services:

  # ─── OpenTelemetry Collector ───────────────────────────────────────────────
  # Actúa como proxy entre las apps y el backend (Jaeger).
  # Ventaja: si cambias de Jaeger a Tempo o Zipkin, solo cambias la config
  # del collector — las apps no necesitan cambios.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    ports:
      - "4317:4317"   # OTLP gRPC — las apps apuntan aquí
      - "4318:4318"   # OTLP HTTP — alternativa HTTP
      - "8888:8888"   # Métricas propias del collector
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger

  # ─── Jaeger (all-in-one) ───────────────────────────────────────────────────
  # Backend de tracing. La imagen all-in-one incluye:
  # collector + query + UI en un único contenedor (ideal para desarrollo).
  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"   # UI web — http://localhost:16686
      - "14250:14250"   # Recepción de spans via gRPC (desde el collector)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
