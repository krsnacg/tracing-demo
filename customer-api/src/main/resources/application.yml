spring:
  application:
    name: customer-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0

  # opentelemetry:
  #   tracing:
  #     export:
  #       otlp:
  #         endpoint: http://localhost:4317
  # otlp:
  #   metrics:
  #     export:
  #       url: none
  otlp:
    metrics:
      export:
        enabled: false 
        
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    '[org.zalando.logbook.Logbook]': TRACE  # https://www.baeldung.com/spring-logbook-http-logging
