services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (el que usa Spring Boot por defecto)
    depends_on: [tempo, prometheus, loki]

  tempo:
    image: grafana/tempo:3.0.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # recibe métricas del collector y de Tempo
    volumes:
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.0   # config por defecto; Loki 3.x acepta OTLP en /otlp

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]

volumes:
  prometheus-data:
  grafana-data: